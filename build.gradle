plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            // Dependency refmaps use SRG names; the development runtime uses official mappings.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', file('build/createSrgToMcp/output.srg').absolutePath
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir layout.buildDirectory.dir('mixin')
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

// Optional development runtime mods stay separate from published dependencies.
configurations {
    localRuntime
    mixinProcessor
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Explicit processor path keeps Forge's runtime Mixin separate from annotation processing.
    mixinProcessor 'org.spongepowered:mixin:0.8.5'
    mixinProcessor 'com.google.code.gson:gson:2.10.1'
    mixinProcessor 'com.google.guava:guava:31.1-jre'
    mixinProcessor 'org.ow2.asm:asm:9.7'
    mixinProcessor 'org.ow2.asm:asm-tree:9.7'
    mixinProcessor 'org.ow2.asm:asm-commons:9.7'
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("maven.modrinth:automobility:${automobility_version}")
    // Optional client bridge; Oculus remains a development-only runtime mod below.
    compileOnly fg.deobf("maven.modrinth:oculus:${oculus_version}")
    // Optional model discovery is gated on the client; RIA is never bundled or required.
    compileOnly fg.deobf("maven.modrinth:riautomobility:${riautomobility_version}")
    compileOnly fg.deobf("maven.modrinth:geckolib:${geckolib_version}")
    localRuntime fg.deobf("maven.modrinth:riautomobility:${riautomobility_version}")
    localRuntime fg.deobf("maven.modrinth:geckolib:${geckolib_version}")
    localRuntime fg.deobf("maven.modrinth:oculus:${oculus_version}")
    localRuntime fg.deobf("maven.modrinth:embeddium:${embeddium_version}")
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn 'compileJava'
    def replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            automobility_version_range: automobility_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
            mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    from('LICENSE')
    // The resource manifest registers Mixins in directory-based development runs.
    exclude 'META-INF/MANIFEST.MF'
    manifest {
        attributes([
                'MixinConfigs': 'autoillumination.mixins.json',
                'Specification-Title': mod_id,
                'Specification-Vendor': mod_authors,
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor': mod_authors
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url = layout.buildDirectory.dir('repo')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('compileJava', JavaCompile).configure {
    dependsOn 'createMcpToSrg'
    options.annotationProcessorPath = configurations.mixinProcessor
    options.compilerArgs += [
        '-AmappingTypes=tsrg',
        "-AreobfTsrgFile=${layout.buildDirectory.file('createMcpToSrg/output.tsrg').get().asFile.absolutePath}",
        "-AoutRefMapFile=${layout.buildDirectory.file('mixin/autoillumination.refmap.json').get().asFile.absolutePath}"
    ]
    outputs.file(layout.buildDirectory.file('mixin/autoillumination.refmap.json'))
}
